<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#c62828">
<title>사과게임 — 시간제한 없음</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="intro">

<section id="screen-intro" class="screen">
  <img id="intro-image" alt="">
  <p id="intro-caption"></p>
  <div id="intro-dots" aria-hidden="true"></div>
  <button id="intro-skip" type="button">건너뛰기</button>
</section>

<section id="screen-menu" class="screen">
  <h1>사과게임 (시간 무제한)</h1>
  <p class="lead">사각형 안 숫자의 합이 <b>10</b>이면 사과가 사라져요.</p>
  <button id="menu-records" type="button" class="link-btn">기록 보기</button>
  <div class="howto">
    <p class="howto-title">이렇게 해요</p>
    <ol>
      <li>사과를 <b>누른 채로 끌어서</b> 네모를 만들어요</li>
      <li>네모 안 숫자를 더해 <b>10</b>이 되면 사라져요</li>
      <li>가로·세로·네모 어떤 모양이든 괜찮아요</li>
    </ol>
    <p class="howto-warn">한 번만 톡 누르면 아무 일도 일어나지 않아요</p>
  </div>
  <div class="levels">
    <button class="level-btn" type="button" data-level="easy">
      <span class="lv">하</span><span class="meta">8 × 6 · 유치원생</span>
    </button>
    <button class="level-btn" type="button" data-level="normal">
      <span class="lv">중</span><span class="meta">12 × 8 · 초등학생</span>
    </button>
    <button class="level-btn" type="button" data-level="hard">
      <span class="lv">상</span><span class="meta">12 × 16 · 중학생</span>
    </button>
    <button class="level-btn" type="button" data-level="expert">
      <span class="lv">최상</span><span class="meta">12 × 20 · 고등학생 이상</span>
    </button>
  </div>
</section>

<section id="screen-game" class="screen">
  <header class="hud">
    <span id="hud-level"></span>
    <span id="hud-score"></span>
    <span id="hud-cleared"></span>
    <button id="game-menu" type="button">그만두기</button>
  </header>
  <div id="board-wrap">
    <div id="board"></div>
    <div id="selection" hidden></div>
    <div id="count-badge" hidden></div>
    <div id="stuck-overlay" hidden>
      <p class="stuck-title">더 이상 10을 만들 수 없어요</p>
      <p id="stuck-score"></p>
      <p id="stuck-rank"></p>
      <div class="stuck-actions">
        <button id="stuck-records" type="button">기록 보기</button>
        <button id="stuck-retry" type="button">다시 하기</button>
        <button id="stuck-menu" type="button">난이도 고르기</button>
      </div>
    </div>
  </div>
</section>

<section id="screen-result" class="screen">
  <img id="result-image" alt="">
  <h2 id="result-title"></h2>
  <p id="result-score"></p>
  <p id="result-rank"></p>
  <div class="result-actions">
    <button id="result-records" type="button">기록 보기</button>
    <button id="result-retry" type="button">다시 하기</button>
    <button id="result-menu" type="button">난이도 고르기</button>
  </div>
</section>

<div id="records-modal" hidden>
  <div class="records-panel">
    <div id="records-tabs" class="records-tabs">
      <button type="button" data-level="easy">하</button>
      <button type="button" data-level="normal">중</button>
      <button type="button" data-level="hard">상</button>
      <button type="button" data-level="expert">최상</button>
    </div>
    <div class="records-header">
      <h2 id="records-title"></h2>
      <span id="records-plays"></span>
    </div>
    <p id="records-empty" hidden>아직 기록이 없어요</p>
    <ol id="records-list"></ol>
    <p id="records-current" hidden></p>
    <button id="records-close" type="button">닫기</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
